# Publish the PHP-free static build to GitHub Pages on every push to main.
# The models come from the repo's "models" branch (an orphan with only the .onnx files).
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: models
          path: models-branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -I tools/build_static.py --models models-branch
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/static
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
